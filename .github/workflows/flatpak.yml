name: Build Avernella Flatpak

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/source-formats.yml'
      - 'scripts/pending-formats'
      - 'scripts/source-release'
      - 'liney/**'
      - 'aur/**'
      - 'rpm/**'
      - 'patches/**'
      - 'scripts/rpm'
      - '.github/workflows/liney-aur.yml'
      - '.github/workflows/packages.yml'
      - '.github/workflows/fedora-rpm.yml'
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source commit on main (defaults to the latest)
        required: false
        type: string

concurrency:
  group: avernella-flatpak
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Avernella source commit
        id: plan
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git clone --quiet --branch main https://github.com/novesce/avernella.git upstream
          sha=${SOURCE_SHA:-$(git -C upstream rev-parse HEAD)}
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          git -C upstream merge-base --is-ancestor "$sha" origin/main
          git -C upstream checkout --quiet --detach "$sha"
          revision=$(git -C upstream rev-list --count HEAD)
          version="0.1+git${revision}.${sha:0:7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update Flatpak manifest and metainfo
        run: |
          scripts/flatpak-recipe upstream flatpak
          git diff --stat -- flatpak/

      - name: Install Flatpak and GNOME 49 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//49 \
            org.gnome.Sdk//49

      - name: Validate desktop file and metainfo
        run: |
          desktop-file-validate flatpak/io.github.novesce.Avernella.desktop
          appstreamcli validate --no-net flatpak/io.github.novesce.Avernella.metainfo.xml

      - name: Build Flatpak repo and bundle
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mkdir -p out/flatpak
          flatpak-builder \
            --force-clean \
            --sandbox \
            --user \
            --disable-rofiles-fuse \
            --ccache \
            --repo=out/flatpak/repo \
            out/flatpak/build \
            flatpak/io.github.novesce.Avernella.yml
          flatpak build-update-repo --prune --prune-depth=1 out/flatpak/repo
          bundle="avernella_${VERSION}_x86_64.flatpak"
          flatpak build-bundle out/flatpak/repo "out/flatpak/$bundle" \
            io.github.novesce.Avernella \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          echo "bundle=$bundle" >> "$GITHUB_ENV"

      - name: Smoke-test installed Flatpak
        run: |
          flatpak install --user -y --noninteractive "out/flatpak/$bundle"
          flatpak run io.github.novesce.Avernella --help
          flatpak run --command=sh io.github.novesce.Avernella -c '
            set -e
            test -x /app/lib/avernella/avernella-liff-gtk
            test -f /app/lib/avernella/avernella-vulkan.so
            test -f /app/lib/libzbar.so.0
            command -v ffmpeg ffplay >/dev/null
          '

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avernella-flatpak-${{ steps.plan.outputs.sha }}
          path: out/flatpak/${{ env.bundle }}
          if-no-files-found: error
          retention-days: 14

      - name: Archive the OSTree files for static hosting
        run: |
          # OSTree's local advisory lock is not part of an HTTP repository.
          tar --hard-dereference --exclude='./.lock' -C out/flatpak/repo -cf out/flatpak/ostree.tar .

      - name: Upload OSTree files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avernella-ostree-${{ steps.plan.outputs.sha }}
          path: out/flatpak/ostree.tar
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ needs.build.outputs.sha }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Recheck the source and derive the asset filename
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          git clone --quiet --no-checkout --branch main https://github.com/novesce/avernella.git upstream
          git -C upstream merge-base --is-ancestor "$SHA" origin/main
          revision=$(git -C upstream rev-list --count "$SHA")
          [[ "$VERSION" == "0.1+git$revision.${SHA:0:7}" ]]
          echo "bundle=avernella_${VERSION}_x86_64.flatpak" >> "$GITHUB_ENV"

      - name: Download bundle from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avernella-flatpak-${{ needs.build.outputs.sha }}
          path: out/flatpak
      - name: Verify the bundle files
        run: |
          cd out/flatpak
          [[ -f "$bundle" && ! -L "$bundle" && -s "$bundle" ]]
          sha256sum "$bundle" > "${bundle}.sha256"

      - name: Check whether this source is still current
        id: channel
        run: |
          git -C upstream fetch --quiet origin main
          if [[ "$(git -C upstream rev-parse origin/main)" == "$SHA" ]]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Flatpak bundle to GitHub Releases
        if: steps.channel.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="GNOME 49 runtime Flatpak (with WebKitGTK LIFF browser) for Avernella $VERSION (https://github.com/novesce/avernella/commit/$SHA). Install with: flatpak install --user ./$bundle"
          if gh release view flatpak-latest >/dev/null 2>&1; then
            for old in $(gh release view flatpak-latest --json assets --jq '.assets[].name'); do
              gh release delete-asset flatpak-latest "$old" -y
            done
            gh release edit flatpak-latest --title "Avernella Flatpak ($VERSION)" --notes "$notes"
            gh release upload flatpak-latest --clobber \
              "out/flatpak/$bundle" "out/flatpak/${bundle}.sha256"
          else
            gh release create flatpak-latest --latest=false \
              --title "Avernella Flatpak ($VERSION)" --notes "$notes" \
              "out/flatpak/$bundle" "out/flatpak/${bundle}.sha256"
          fi

      - name: Download OSTree archive from this run
        if: steps.channel.outputs.latest == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avernella-ostree-${{ needs.build.outputs.sha }}
          path: out/site
      - name: Stage the static OSTree files
        if: steps.channel.outputs.latest == 'true'
        run: |
          python3 scripts/unpack-static-repo out/site/ostree.tar out/flatpak/repo
          test -s out/flatpak/repo/summary

      - name: Publish Flatpak OSTree repository to GitHub Pages
        if: steps.channel.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/publish-gh-pages flatpak out/flatpak/repo "$VERSION" "$SHA"

      - name: Commit updated Flatpak manifest to main
        if: steps.channel.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C upstream fetch --quiet origin main
          [[ "$(git -C upstream rev-parse origin/main)" == "$SHA" ]] || exit 0
          git -C upstream checkout --quiet --detach "$SHA"
          scripts/flatpak-recipe upstream flatpak
          if git diff --quiet -- flatpak/io.github.novesce.Avernella.yml flatpak/io.github.novesce.Avernella.metainfo.xml; then
            echo "Manifest already matches $SHA."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flatpak/io.github.novesce.Avernella.yml flatpak/io.github.novesce.Avernella.metainfo.xml
          git commit -m "Update Flatpak manifest to Avernella $VERSION"
          gh auth setup-git
          git pull --rebase origin main
          git push origin HEAD:refs/heads/main

      - name: Archive this source revision's Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/source-release "$SHA"
          gh release upload "avernella-$SHA" --clobber \
            "out/flatpak/$bundle" "out/flatpak/${bundle}.sha256"
