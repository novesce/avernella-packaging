name: Build Avernella Fedora RPM repository

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/source-formats.yml'
      - 'scripts/pending-formats'
      - 'scripts/source-release'
      - 'liney/**'
      - 'aur/**'
      - 'flatpak/**'
      - 'patches/**'
      - 'scripts/flatpak-recipe'
      - '.github/workflows/liney-aur.yml'
      - '.github/workflows/packages.yml'
      - '.github/workflows/flatpak.yml'
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source commit on main (defaults to the latest)
        required: false
        type: string

concurrency:
  group: avernella-fedora-rpm
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Select Avernella source commit
        id: check
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git clone --quiet --branch main https://github.com/novesce/avernella.git upstream
          sha=${SOURCE_SHA:-$(git -C upstream rev-parse HEAD)}
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          git -C upstream merge-base --is-ancestor "$sha" origin/main
          git -C upstream checkout --quiet --detach "$sha"
          revision=$(git -C upstream rev-list --count HEAD)
          version="0.1^git${revision}.${sha:0:7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    timeout-minutes: 35
    steps:
      - name: Install Fedora 41 build dependencies
        run: |
          dnf install -y \
            git gcc make binutils pkgconf-pkg-config curl tar xz patch which diffutils \
            cmake ninja-build autoconf automake libtool nasm perl \
            rpm-build desktop-file-utils \
            glslang spirv-tools vulkan-loader \
            'pkgconfig(sdl2)' \
            'pkgconfig(wayland-client)' 'pkgconfig(wayland-protocols)' \
            'pkgconfig(pangocairo)' \
            'pkgconfig(glib-2.0)' \
            'pkgconfig(gio-2.0)' \
            'pkgconfig(gio-unix-2.0)' \
            'pkgconfig(libqrencode)' \
            'pkgconfig(libcurl)' \
            'pkgconfig(libcrypto)' \
            'pkgconfig(libturbojpeg)' \
            'pkgconfig(libpng)' \
            'pkgconfig(libwebp)' \
            'pkgconfig(opus)' \
            'pkgconfig(libsrtp2)' \
            'pkgconfig(zlib)' \
            'pkgconfig(libpipewire-0.3)' \
            'pkgconfig(libseccomp)' \
            'pkgconfig(zbar)' \
            'pkgconfig(webkitgtk-6.0)'

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Build universal Fedora x86_64 RPM
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git clone --quiet --branch main https://github.com/novesce/avernella.git upstream
          git -C upstream checkout --quiet --detach "$SHA"
          scripts/rpm upstream out/rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avernella-rpm-x86_64-${{ needs.plan.outputs.sha }}
          path: out/rpm/avernella-*.rpm
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        fedora: ['41', '42', '43', '44', '45']
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ matrix.fedora }}
    timeout-minutes: 15
    steps:
      - name: Download built RPM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avernella-rpm-x86_64-${{ needs.plan.outputs.sha }}
          path: out/rpm

      - name: Install and verify RPM on Fedora ${{ matrix.fedora }}
        run: |
          cat /etc/fedora-release
          rpm_file=$(ls out/rpm/avernella-*.rpm | head -n 1)
          dnf install -y --setopt=install_weak_deps=False "$rpm_file"
          /usr/bin/avernella --help
          test -x /usr/lib/avernella/avernella-liff-gtk
          test -f /usr/lib/avernella/avernella-vulkan.so
          for bin in /usr/bin/avernella /usr/lib/avernella/avernella-liff-gtk /usr/lib/avernella/avernella-vulkan.so; do
            if ldd "$bin" | grep -q 'not found'; then
              echo "Unresolved shared library in $bin on Fedora ${{ matrix.fedora }}:" >&2
              ldd "$bin" >&2
              exit 1
            fi
          done

  publish:
    needs: [plan, build, verify]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Download built RPM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avernella-rpm-x86_64-${{ needs.plan.outputs.sha }}
          path: out/release

      - name: Install createrepo_c
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends createrepo-c

      - name: Build DNF repository metadata
        run: |
          arch_dir="out/rpm-site/fedora/x86_64"
          mkdir -p "$arch_dir"
          cp -f out/release/avernella-*.rpm "$arch_dir/"
          createrepo_c --simple-md-filenames "$arch_dir"
          (cd out/release && sha256sum avernella-*.rpm > SHA256SUMS)
          ls -la out/release "$arch_dir"

      - name: Check whether this source is still current
        id: channel
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          latest=$(git ls-remote --exit-code https://github.com/novesce/avernella.git refs/heads/main)
          if [[ "${latest%%$'\t'*}" == "$SHA" ]]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish RPM to GitHub Releases
        if: steps.channel.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          notes="Universal Fedora x86_64 RPM package (tested on Fedora 41, 42, 43, and Rawhide / Fedora 45+) for Avernella ${VERSION} (https://github.com/novesce/avernella/commit/${SHA}).

          Install via the auto-updating DNF repository:
          \`\`\`sh
          sudo curl -fsSL https://novesce.github.io/avernella-packaging/avernella.repo -o /etc/yum.repos.d/avernella.repo
          sudo dnf install -y avernella
          \`\`\`"
          if gh release view rpm-latest >/dev/null 2>&1; then
            for old in $(gh release view rpm-latest --json assets --jq '.assets[].name'); do
              gh release delete-asset rpm-latest "$old" -y
            done
            gh release edit rpm-latest --title "Avernella Fedora RPM (${VERSION})" --notes "$notes"
            gh release upload rpm-latest --clobber out/release/avernella-*.rpm out/release/SHA256SUMS
          else
            gh release create rpm-latest --latest=false \
              --title "Avernella Fedora RPM (${VERSION})" --notes "$notes" \
              out/release/avernella-*.rpm out/release/SHA256SUMS
          fi

      - name: Publish DNF repository to GitHub Pages
        if: steps.channel.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          scripts/publish-gh-pages rpm out/rpm-site "$VERSION" "$SHA"

      - name: Archive this source revision's RPM
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          scripts/source-release "$SHA"
          gh release upload "avernella-$SHA" --clobber out/release/avernella-*.rpm
