name: Queue per-commit Flatpak builds

on:
  schedule:
    - cron: '12,32,52 * * * *'
  workflow_dispatch:

# Every reconciliation walks the full range, including intervening commits
# from multi-commit pushes and work left over from an earlier run.
concurrency:
  group: avernella-source-formats
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pending:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      flatpak: ${{ steps.plan.outputs.flatpak }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check queue behavior with partial releases
        run: |
          python3 tests/package-queue.py
          python3 tests/release-boundaries.py
      - name: Find missing release assets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch main https://github.com/novesce/avernella.git upstream
          scripts/pending-formats upstream >> "$GITHUB_OUTPUT"

  flatpak:
    needs: pending
    if: needs.pending.outputs.flatpak != '[]'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sha: ${{ fromJSON(needs.pending.outputs.flatpak) }}
    uses: ./.github/workflows/flatpak.yml
    with:
      source_sha: ${{ matrix.sha }}
