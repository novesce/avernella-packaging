name: Build Avernella Debian packages

on:
  push:
    branches: [main]
    tags: ['avernella-source-*']
    paths-ignore:
      - 'liney/**'
      - '.github/workflows/liney-aur.yml'
      - 'flatpak/**'
      - 'scripts/flatpak-recipe'
      - '.github/workflows/flatpak.yml'
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: avernella-packages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Find app commits without a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch main https://github.com/novesce/avernella.git upstream
          scripts/pending upstream > pending
          if [[ -s pending ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ubuntu build dependencies
        if: steps.plan.outputs.build == 'true'
        run: |
          cat /etc/os-release
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make dpkg-dev pkg-config \
            libsdl2-dev libpango1.0-dev libglib2.0-dev libqrencode-dev \
            libcurl4-openssl-dev libssl-dev libturbojpeg0-dev libpng-dev libwebp-dev \
            libopus-dev libsrtp2-dev zlib1g-dev libvpx-dev libpipewire-0.3-dev \
            libzbar-dev ffmpeg libwebkitgtk-6.0-dev xvfb xauth dbus-daemon python3 \
            cmake ninja-build autoconf automake libtool glslang-tools spirv-tools libvulkan1
          if apt-cache show libwpewebkit-2.0-dev >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libwpewebkit-2.0-dev || true
          fi
          if ! pkg-config --exists wpe-webkit-2.0 wpe-platform-wayland-2.0; then
            echo 'Building with the WebKitGTK fallback. The WPE Wayland SDK is unavailable.'
          fi

      - name: Build static dependencies
        if: steps.plan.outputs.build == 'true'
        run: |
          scripts/json-c out/json-c
          scripts/rnnoise out/rnnoise
          scripts/vulkan-sdk out/vulkan

      - name: Build and validate each package
        if: steps.plan.outputs.build == 'true'
        run: |
          while IFS= read -r sha; do
            dir="$PWD/out/$sha"
            git -C upstream checkout --quiet --detach "$sha"
            git -C upstream clean -ffdx
            if scripts/deb upstream "$dir" out/json-c out/rnnoise out/vulkan &&
                scripts/ubuntu-check "$dir"; then
              mkdir -p "$dir/source/avernella/dependencies"
              git -C upstream archive "$sha" | tar -xf - -C "$dir/source/avernella"
              if [[ -s "$dir/packaging.patch" ]]; then
                patch --quiet -d "$dir/source/avernella" -p1 < "$dir/packaging.patch"
              fi
              cp out/{json-c,rnnoise,vulkan}/sources/* "$dir/source/avernella/dependencies/"
              git archive HEAD --prefix=avernella-packaging/ | tar -xf - -C "$dir/source"
              tar -C "$dir/source" -czf "$dir/avernella-source.tar.gz" avernella avernella-packaging
              touch "$dir/verified"
            else
              echo "::error::Packaging failed for $sha. A later run will retry it."
            fi
          done < pending

      - name: Publish verified packages
        if: steps.plan.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          tip=$(git -C upstream rev-parse origin/main)
          . /etc/os-release
          while IFS= read -r sha; do
            dir="$PWD/out/$sha"
            if [[ ! -f "$dir/verified" ]]; then
              failed=1
              continue
            fi
            read -r deb < "$dir/deb-name"
            read -r version < "$dir/version"
            assets=("$deb" avernella-source.tar.gz)
            (cd "$dir" && sha256sum "${assets[@]}" > SHA256SUMS)
            latest=false
            [[ "$sha" != "$tip" ]] || latest=true
            notes="Built on $PRETTY_NAME (GitHub ubuntu-latest, amd64) from https://github.com/novesce/avernella/commit/$sha."
            if [[ -s "$dir/packaging.patch" ]]; then
              notes+=" Includes the Ubuntu scrolling fix. The installed package contains the applied diff in /usr/share/doc/avernella/packaging.patch, and the source archive includes the patched sources."
            fi
            gh release create "avernella-$sha" --latest="$latest" \
              --title "Avernella $version" --notes "$notes" \
              "${assets[@]/#/$dir/}" "$dir/SHA256SUMS"
          done < pending
          exit "$failed"

  arch:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check the latest release against the AUR
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view --json tagName,assets)
          tag=$(jq -er '.tagName' <<< "$release")
          file=$(jq -er '[.assets[].name | select(endswith("_amd64.deb"))] | select(length == 1) | .[0]' <<< "$release")
          [[ "$tag" =~ ^avernella-([a-f0-9]{40})$ ]]
          sha=${BASH_REMATCH[1]}
          [[ "$file" =~ ^avernella_(0\.1\+git[1-9][0-9]*\.([0-9a-f]{7}))_amd64\.deb$ ]]
          version=${BASH_REMATCH[1]}
          [[ "${BASH_REMATCH[2]}" == "${sha:0:7}" ]]
          rel=$(sed -nE 's/^pkgrel=([0-9]+)$/\1/p' aur/PKGBUILD.in)
          [[ -n "$rel" ]]
          current=$(curl --fail --silent --show-error --retry 3 --get \
            --data-urlencode 'arg[]=avernella-bin' https://aur.archlinux.org/rpc/v5/info |
            jq -er 'select(.type == "multiinfo") | [.results[] | select(.Name == "avernella-bin") | .Version][0] // "0"')
          if dpkg --compare-versions "$current" gt "$version-$rel"; then
            echo 'The AUR already has a newer release.'
          elif [[ "$current" != "$version-$rel" || "$GITHUB_EVENT_NAME" == workflow_dispatch ||
              ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ) ]]; then
            printf 'sha=%s\nfile=%s\n' "$sha" "$file" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the released Debian asset
        if: steps.plan.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.plan.outputs.sha }}
          FILE: ${{ steps.plan.outputs.file }}
        run: |
          mkdir -p out/aur
          cd out/aur
          gh release download "avernella-$SHA" --pattern "$FILE" --pattern SHA256SUMS
          hash=$(awk -v file="$FILE" '$2 == file {print $1}' SHA256SUMS)
          [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$hash" "$FILE" | sha256sum --strict --check

      - name: Build, install and check relocations on Arch Linux
        if: steps.plan.outputs.sha != ''
        env:
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          docker run --rm --pull=always \
            -v "$PWD:/recipe:ro" -v "$PWD/out/aur:/out" \
            archlinux:base-devel /recipe/scripts/arch-check /out "$SHA"

      - name: Publish the verified AUR recipe
        if: steps.plan.outputs.sha != ''
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            scripts/publish-aur out/aur
          else
            echo 'Arch package validated. Configure AUR_SSH_PRIVATE_KEY to enable AUR updates.'
          fi
