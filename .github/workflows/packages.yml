name: Build Avernella Debian packages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'liney/**'
      - '.github/workflows/liney-aur.yml'
      - 'flatpak/**'
      - 'scripts/flatpak-recipe'
      - 'scripts/publish-gh-pages'
      - '.github/workflows/flatpak.yml'
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

concurrency:
  group: avernella-packages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shas: ${{ steps.queue.outputs.shas }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check publisher input validation
        run: python3 tests/release-boundaries.py
      - name: Find app commits without a release
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --branch main https://github.com/novesce/avernella.git upstream
          scripts/pending upstream > pending
          shas=$(jq -Rsc 'split("\n") | map(select(length > 0)) | .[:32]' pending)
          echo "shas=$shas" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    if: needs.plan.outputs.shas != '[]'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sha: ${{ fromJSON(needs.plan.outputs.shas) }}
    uses: ./.github/workflows/debian.yml
    with:
      source_sha: ${{ matrix.sha }}

  latest:
    needs: [plan, package]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      file: ${{ steps.release.outputs.file }}
      hash: ${{ steps.release.outputs.hash }}
    steps:
      - name: Mark the current verified Debian release as latest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --no-checkout --branch main https://github.com/novesce/avernella.git upstream
          sha=$(git -C upstream rev-parse origin/main)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          revision=$(git -C upstream rev-list --count "$sha")
          tag="avernella-$sha"
          file="avernella_0.1+git$revision.${sha:0:7}_amd64.deb"
          if ! release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft); then
            exit 0
          fi
          if ! jq -e --arg file "$file" '.isDraft == false and
              ([.assets[] | select(.state == "uploaded" and .size > 0) | .name] |
              index("SHA256SUMS") and index("avernella-source.tar.gz") and index($file))' \
              <<< "$release" >/dev/null; then
            exit 0
          fi
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" |
            jq -er --arg file "$file" '.assets[] | select(.state == "uploaded" and .name == $file) | .digest')
          [[ "$digest" =~ ^sha256:([a-f0-9]{64})$ ]]
          hash=${BASH_REMATCH[1]}
          if [[ "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" != "$tag" ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
          fi
          printf 'sha=%s\nfile=%s\nhash=%s\n' "$sha" "$file" "$hash" >> "$GITHUB_OUTPUT"

  arch:
    needs: latest
    if: needs.latest.outputs.sha != ''
    outputs:
      validated: ${{ steps.plan.outputs.validated }}
    env:
      SHA: ${{ needs.latest.outputs.sha }}
      FILE: ${{ needs.latest.outputs.file }}
      HASH: ${{ needs.latest.outputs.hash }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check the latest release against the AUR
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ && "$HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$FILE" =~ ^avernella_(0\.1\+git[1-9][0-9]*\.([0-9a-f]{7}))_amd64\.deb$ ]]
          version=${BASH_REMATCH[1]}
          [[ "${BASH_REMATCH[2]}" == "${SHA:0:7}" ]]
          rel=$(sed -nE 's/^pkgrel=([0-9]+)$/\1/p' aur/PKGBUILD.in)
          [[ -n "$rel" ]]
          current=$(curl --fail --silent --show-error --retry 3 --get \
            --data-urlencode 'arg[]=avernella-bin' https://aur.archlinux.org/rpc/v5/info |
            jq -er 'select(.type == "multiinfo") | [.results[] | select(.Name == "avernella-bin") | .Version][0] // "0"')
          if dpkg --compare-versions "$current" gt "$version-$rel"; then
            echo 'The AUR already has a newer release.'
          elif [[ "$current" != "$version-$rel" || "$GITHUB_EVENT_NAME" == workflow_dispatch ||
              ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ) ]]; then
            echo 'validated=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the released Debian asset
        if: steps.plan.outputs.validated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/aur
          cd out/aur
          gh release download "avernella-$SHA" --pattern "$FILE" --pattern SHA256SUMS
          hash=$(awk -v file="$FILE" '$2 == file {print $1}' SHA256SUMS)
          [[ "$hash" == "$HASH" ]]
          printf '%s  %s\n' "$hash" "$FILE" | sha256sum --strict --check

      - name: Build, install and check relocations on Arch Linux
        if: steps.plan.outputs.validated == 'true'
        run: |
          docker run --rm --pull=always \
            -v "$PWD:/recipe:ro" -v "$PWD/out/aur:/out" \
            archlinux:base-devel /recipe/scripts/arch-check /out "$SHA"

      - name: Upload verification metadata
        if: steps.plan.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avernella-aur-${{ needs.latest.outputs.sha }}
          path: out/aur/build-info
          if-no-files-found: error
          retention-days: 1

  aur-publish:
    needs: [arch, latest]
    if: needs.arch.outputs.validated == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download metadata from the Arch verification job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avernella-aur-${{ needs.latest.outputs.sha }}
          path: out/verified
      - name: Recreate the verified recipe from the trusted template
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.latest.outputs.sha }}
          FILE: ${{ needs.latest.outputs.file }}
          HASH: ${{ needs.latest.outputs.hash }}
        run: |
          latest=$(git ls-remote --exit-code https://github.com/novesce/avernella.git refs/heads/main)
          [[ "${latest%%$'\t'*}" == "$SHA" ]] || exit 0
          [[ "$SHA" =~ ^[a-f0-9]{40}$ && "$HASH" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/avernella-$SHA" |
            jq -r --arg file "$FILE" '.assets[] | select(.state == "uploaded" and .name == $file) | .digest' |
            grep -Fx "sha256:$HASH"
          scripts/aur-render "$FILE" "$SHA" "$HASH" out/verified/build-info out/aur
          echo 'current=true' >> "$GITHUB_OUTPUT"

      - name: Publish the verified AUR recipe
        if: steps.prepare.outputs.current == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            scripts/publish-aur out/aur
          else
            echo 'Arch package validated. Configure AUR_SSH_PRIVATE_KEY to enable AUR updates.'
          fi

  # Fedora: COPR builds an RPM that repackages the verified Debian release,
  # with Ubuntu's libvpx.so.12 bundled for Fedora 43 and 44.
  fedora-plan:
    needs: latest
    if: needs.latest.outputs.sha != ''
    outputs:
      validated: ${{ steps.plan.outputs.validated }}
    env:
      SHA: ${{ needs.latest.outputs.sha }}
      FILE: ${{ needs.latest.outputs.file }}
      HASH: ${{ needs.latest.outputs.hash }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the latest release against COPR
        id: plan
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ && "$HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$FILE" =~ ^avernella_0\.1\+(git[1-9][0-9]*\.([0-9a-f]{7}))_amd64\.deb$ ]]
          [[ "${BASH_REMATCH[2]}" == "${SHA:0:7}" ]]
          version="0.1^${BASH_REMATCH[1]}"
          current=$(curl --silent --show-error --retry 3 --get \
            --data-urlencode ownername=novesce --data-urlencode projectname=avernella \
            --data-urlencode packagename=avernella --data-urlencode with_latest_succeeded_build=True \
            https://copr.fedorainfracloud.org/api_3/package |
            jq -r '.builds.latest_succeeded.source_package.version // "0"' 2>/dev/null || echo 0)
          echo "COPR has ${current}; the release is ${version}."
          if [[ "$current" != "$version"-* || "$GITHUB_EVENT_NAME" == workflow_dispatch ||
              ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ) ]]; then
            echo 'validated=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify the released Debian asset
        if: steps.plan.outputs.validated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/fedora
          cd out/fedora
          gh release download "avernella-$SHA" --repo "$GITHUB_REPOSITORY" --pattern "$FILE"
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum --strict --check

      - name: Hand the verified asset to the Fedora checks
        if: steps.plan.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avernella-fedora-deb-${{ needs.latest.outputs.sha }}
          path: out/fedora/${{ needs.latest.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  fedora:
    needs: [latest, fedora-plan]
    if: needs.fedora-plan.outputs.validated == 'true'
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44', '45', 'rawhide']
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ matrix.fedora }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download the verified Debian asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avernella-fedora-deb-${{ needs.latest.outputs.sha }}
          path: out/fedora
      - name: Build, install and check the RPM on Fedora ${{ matrix.fedora }}
        env:
          SHA: ${{ needs.latest.outputs.sha }}
          HASH: ${{ needs.latest.outputs.hash }}
        run: |
          printf '%s  %s\n' "$HASH" out/fedora/avernella_*_amd64.deb | sha256sum --strict --check
          scripts/fedora-check out/fedora "$SHA"
      - name: Keep the source RPM for COPR
        if: matrix.fedora == '44'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avernella-srpm-${{ needs.latest.outputs.sha }}
          path: out/fedora/avernella-*.src.rpm
          if-no-files-found: error
          retention-days: 3

  copr-publish:
    needs: [latest, fedora]
    if: needs.fedora.result == 'success'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download the checked source RPM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: avernella-srpm-${{ needs.latest.outputs.sha }}
          path: out/srpm
      - name: Build it in COPR
        env:
          SHA: ${{ needs.latest.outputs.sha }}
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          latest=$(git ls-remote --exit-code https://github.com/novesce/avernella.git refs/heads/main)
          if [[ "${latest%%$'\t'*}" != "$SHA" ]]; then
            echo 'A newer source revision is available. Its run updates COPR.'
            exit 0
          fi
          srpms=(out/srpm/avernella-*.src.rpm)
          [[ ${#srpms[@]} == 1 && -f "${srpms[0]}" ]]
          if [[ -z "$COPR_CONFIG" ]]; then
            echo 'Fedora RPM validated. Configure COPR_CONFIG to enable COPR updates.'
            exit 0
          fi
          umask 077
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          unset COPR_CONFIG
          trap 'rm -f ~/.config/copr' EXIT
          pipx install copr-cli
          # Waits for every chroot and fails if any build fails.
          copr-cli build novesce/avernella "${srpms[0]}"
