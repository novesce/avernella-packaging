name: Publish Liney releases to the AUR

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  push:
    branches: [main]
    paths:
      - 'liney/**'
      - '.github/workflows/liney-aur.yml'
      - 'aur/known_hosts'
      - 'scripts/publish-aur'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liney-aur
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Find unpublished stable releases
        id: plan
        env:
          AUR_MAINTAINER: ${{ vars.AUR_MAINTAINER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(python3 liney/pending | jq -c '.[:12]')
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          jq -r 'if length == 0 then "AUR is up to date." else .[].tag end' <<< "$releases"

  build:
    needs: discover
    if: needs.discover.outputs.releases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        release: ${{ fromJSON(needs.discover.outputs.releases) }}
    env:
      VERSION: ${{ matrix.release.version }}
      DEB_SUM: ${{ matrix.release.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download and verify the official release
        run: |
          mkdir -p "$RUNNER_TEMP/liney"
          cd "$RUNNER_TEMP/liney"
          deb="Liney-$VERSION-amd64.deb"
          license="Liney-$VERSION-LICENSE"
          curl -fLsS --retry 3 -o "$deb" "https://github.com/Cytech-Team/Liney/releases/download/v$VERSION/$deb"
          printf '%s  %s\n' "$DEB_SUM" "$deb" | sha256sum --check --strict
          curl -fLsS --retry 3 -o "$license" "https://raw.githubusercontent.com/Cytech-Team/Liney/v$VERSION/LICENSE"
          grep -Fxq 'SPDX-License-Identifier: LicenseRef-TLL-1.0' "$license"
          test "$(dpkg-deb -f "$deb" Package)" = liney
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          test "$(dpkg-deb -f "$deb" License)" = LicenseRef-TLL-1.0
          license_sum=$(sha256sum "$license" | cut -d ' ' -f1)
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@DEB_SHA256@/$DEB_SUM/g" \
              -e "s/@LICENSE_SHA256@/$license_sum/g" "$GITHUB_WORKSPACE/liney/PKGBUILD.in" > PKGBUILD
      - name: Build and check the Arch package
        run: |
          docker run --rm -v "$PWD:/recipe:ro" -v "$RUNNER_TEMP/liney:/out" \
            archlinux:base-devel /recipe/liney/arch-check /out
      - name: Save the validated AUR files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liney-${{ matrix.release.version }}
          path: |
            ${{ runner.temp }}/liney/PKGBUILD
            ${{ runner.temp }}/liney/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [discover, build]
    if: >-
      !cancelled() && needs.discover.result == 'success' &&
      needs.discover.outputs.releases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: liney-*
          path: ${{ runner.temp }}/recipes
      - name: Publish verified releases in version order
        env:
          RELEASES: ${{ needs.discover.outputs.releases }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          while read -r version; do
            dir="$RUNNER_TEMP/recipes/liney-$version"
            test -f "$dir/PKGBUILD" && test -f "$dir/.SRCINFO" || {
              echo "::error::No validated recipe for v$version. Later versions will wait."
              exit 1
            }
            test "$(awk '$1 == "pkgver" { print $3 }' "$dir/.SRCINFO")" = "$version"
            scripts/publish-aur "$dir" liney-bin
          done < <(jq -r '.[].version' <<< "$RELEASES")
